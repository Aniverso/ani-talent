[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ani-talent"
dynamic = ["version"]
description = "Read the Ani talent database with your own account: a command and an MCP server."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
dependencies = []

[project.scripts]
ani-talent = "ani_talent:cli"

[tool.setuptools]
packages = ["ani_talent"]

[tool.setuptools.package-data]
ani_talent = ["SKILL.md"]

[tool.setuptools.dynamic]
version = { attr = "ani_talent.VERSION" }
